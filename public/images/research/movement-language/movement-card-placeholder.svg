<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Twelve movement probes for Movement as a Language</title>
  <desc id="desc">A dark research atlas of twelve controlled movement variations drawn with fine amber trajectories.</desc>
  <defs>
    <marker id="forward" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d7a765"/></marker>
    <marker id="reverse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c8796c"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#111116"/>
  <text x="32" y="40" fill="#f1eee7" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">12 MOVEMENT PROBES</text>
  <text x="1168" y="40" fill="#88847f" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="end">movement → perceived meaning</text>

  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(30 70)"><rect width="273" height="140" rx="12" fill="#17171c" stroke="#343239"/><text x="16" y="25" fill="#d7a765" font-size="14" font-weight="700">01</text><text x="48" y="25" fill="#f1eee7" font-size="14" font-weight="600">Direct</text><circle cx="22" cy="77" r="5" fill="#74716d"/><path d="M31 77H239" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><circle cx="251" cy="77" r="7" fill="#f1eee7"/><text x="16" y="121" fill="#817d77" font-size="11">constant speed · straight path</text></g>
    <g transform="translate(319 70)"><rect width="273" height="140" rx="12" fill="#17171c" stroke="#343239"/><text x="16" y="25" fill="#d7a765" font-size="14" font-weight="700">02</text><text x="48" y="25" fill="#f1eee7" font-size="14" font-weight="600">Slow</text><circle cx="22" cy="77" r="5" fill="#74716d"/><path d="M31 77H239" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><circle cx="82" cy="77" r="2.5" fill="#f1eee7"/><circle cx="135" cy="77" r="2.5" fill="#f1eee7"/><circle cx="188" cy="77" r="2.5" fill="#f1eee7"/><circle cx="251" cy="77" r="7" fill="#f1eee7"/><text x="16" y="121" fill="#817d77" font-size="11">low velocity · even timing</text></g>
    <g transform="translate(608 70)"><rect width="273" height="140" rx="12" fill="#17171c" stroke="#343239"/><text x="16" y="25" fill="#d7a765" font-size="14" font-weight="700">03</text><text x="48" y="25" fill="#f1eee7" font-size="14" font-weight="600">Accelerating</text><circle cx="22" cy="77" r="5" fill="#74716d"/><path d="M31 77Q146 80 239 65" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><circle cx="70" cy="77" r="5" fill="#f1eee7"/><circle cx="137" cy="75" r="3.5" fill="#f1eee7"/><circle cx="205" cy="69" r="2" fill="#f1eee7"/><circle cx="251" cy="61" r="7" fill="#f1eee7"/><text x="16" y="121" fill="#817d77" font-size="11">positive acceleration</text></g>
    <g transform="translate(897 70)"><rect width="273" height="140" rx="12" fill="#17171c" stroke="#343239"/><text x="16" y="25" fill="#d7a765" font-size="14" font-weight="700">04</text><text x="48" y="25" fill="#f1eee7" font-size="14" font-weight="600">Decelerating</text><circle cx="22" cy="77" r="5" fill="#74716d"/><path d="M31 77Q142 61 239 71" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><circle cx="72" cy="72" r="2" fill="#f1eee7"/><circle cx="139" cy="65" r="3.5" fill="#f1eee7"/><circle cx="205" cy="68" r="5" fill="#f1eee7"/><circle cx="251" cy="73" r="7" fill="#f1eee7"/><text x="16" y="121" fill="#817d77" font-size="11">negative acceleration</text></g>

    <g transform="translate(30 226)"><rect width="273" height="140" rx="12" fill="#17171c" stroke="#343239"/><text x="16" y="25" fill="#d7a765" font-size="14" font-weight="700">05</text><text x="48" y="25" fill="#f1eee7" font-size="14" font-weight="600">Early Pause</text><circle cx="22" cy="77" r="5" fill="#74716d"/><path d="M31 77H91" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><path d="M103 77H143" fill="none" stroke="#8d8983" stroke-width="3" stroke-dasharray="7 7"/><path d="M153 77H239" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><circle cx="251" cy="77" r="7" fill="#f1eee7"/><text x="16" y="121" fill="#817d77" font-size="11">pause position · 25%</text></g>
    <g transform="translate(319 226)"><rect width="273" height="140" rx="12" fill="#17171c" stroke="#343239"/><text x="16" y="25" fill="#d7a765" font-size="14" font-weight="700">06</text><text x="48" y="25" fill="#f1eee7" font-size="14" font-weight="600">Late Pause</text><circle cx="22" cy="77" r="5" fill="#74716d"/><path d="M31 77H169" fill="none" stroke="#d7a765" stroke-width="3"/><path d="M175 77H213" fill="none" stroke="#8d8983" stroke-width="3" stroke-dasharray="7 7"/><path d="M219 77H239" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><circle cx="251" cy="77" r="7" fill="#f1eee7"/><text x="16" y="121" fill="#817d77" font-size="11">pause position · 75%</text></g>
    <g transform="translate(608 226)"><rect width="273" height="140" rx="12" fill="#17171c" stroke="#343239"/><text x="16" y="25" fill="#d7a765" font-size="14" font-weight="700">07</text><text x="48" y="25" fill="#f1eee7" font-size="14" font-weight="600">Small Reversal</text><circle cx="22" cy="77" r="5" fill="#74716d"/><path d="M31 77H129" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><path d="M142 77H105" fill="none" stroke="#c8796c" stroke-width="3" marker-end="url(#reverse)"/><path d="M148 77H239" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><circle cx="251" cy="77" r="7" fill="#f1eee7"/><text x="16" y="121" fill="#817d77" font-size="11">short correction · resume</text></g>
    <g transform="translate(897 226)"><rect width="273" height="140" rx="12" fill="#17171c" stroke="#343239"/><text x="16" y="25" fill="#d7a765" font-size="14" font-weight="700">08</text><text x="48" y="25" fill="#f1eee7" font-size="14" font-weight="600">Large Reversal</text><circle cx="22" cy="77" r="5" fill="#74716d"/><path d="M31 77H105" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><path d="M214 77H95" fill="none" stroke="#c8796c" stroke-width="3" marker-end="url(#reverse)"/><path d="M219 77H239" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><circle cx="251" cy="77" r="7" fill="#f1eee7"/><text x="16" y="121" fill="#817d77" font-size="11">large retreat · resume</text></g>

    <g transform="translate(30 382)"><rect width="273" height="140" rx="12" fill="#17171c" stroke="#343239"/><text x="16" y="25" fill="#d7a765" font-size="14" font-weight="700">09</text><text x="48" y="25" fill="#f1eee7" font-size="14" font-weight="600">Gentle Oscillation</text><circle cx="22" cy="77" r="5" fill="#74716d"/><path d="M31 77C51 55 71 99 91 77S131 55 151 77S191 99 211 77S229 65 239 77" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><circle cx="251" cy="77" r="7" fill="#f1eee7"/><text x="16" y="121" fill="#817d77" font-size="11">low frequency · high amplitude</text></g>
    <g transform="translate(319 382)"><rect width="273" height="140" rx="12" fill="#17171c" stroke="#343239"/><text x="16" y="25" fill="#d7a765" font-size="14" font-weight="700">10</text><text x="48" y="25" fill="#f1eee7" font-size="14" font-weight="600">Tremor</text><circle cx="22" cy="77" r="5" fill="#74716d"/><path d="M31 77C38 57 45 97 52 77S66 57 73 77S87 97 94 77S108 57 115 77S129 97 136 77S150 57 157 77S171 97 178 77S192 57 199 77S213 97 220 77S232 62 239 77" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><circle cx="251" cy="77" r="7" fill="#f1eee7"/><text x="16" y="121" fill="#817d77" font-size="11">high frequency · low amplitude</text></g>
    <g transform="translate(608 382)"><rect width="273" height="140" rx="12" fill="#17171c" stroke="#343239"/><text x="16" y="25" fill="#d7a765" font-size="14" font-weight="700">11</text><text x="48" y="25" fill="#f1eee7" font-size="14" font-weight="600">Curve A</text><circle cx="22" cy="86" r="5" fill="#74716d"/><path d="M31 86Q143 38 239 58" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><circle cx="251" cy="54" r="7" fill="#f1eee7"/><text x="16" y="121" fill="#817d77" font-size="11">positive curvature</text></g>
    <g transform="translate(897 382)"><rect width="273" height="140" rx="12" fill="#17171c" stroke="#343239"/><text x="16" y="25" fill="#d7a765" font-size="14" font-weight="700">12</text><text x="48" y="25" fill="#f1eee7" font-size="14" font-weight="600">Curve B</text><circle cx="22" cy="58" r="5" fill="#74716d"/><path d="M31 58Q143 108 239 78" fill="none" stroke="#d7a765" stroke-width="3" marker-end="url(#forward)"/><circle cx="251" cy="74" r="7" fill="#f1eee7"/><text x="16" y="121" fill="#817d77" font-size="11">negative curvature</text></g>
  </g>
